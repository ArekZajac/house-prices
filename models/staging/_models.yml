models:
  - name: stg_price_paid
    description: One row per record in raw.price_paid, typed, with each code decoded next to the original. Keeps both PPD categories.
    columns:
      - name: transaction_id
        description: Land Registry's id for the sale, braces removed.
        data_tests:
          - unique
          - not_null
      - name: postcode
        description: Trimmed, since 821 sales from 2009 carry a trailing space. 1,141 sales in the September 2026 release have a postcode the August 2026 NSPL does not hold, so the test warns only above that and errors at a count only a broken join would reach.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_postcodes')
                field: postcode
              config:
                warn_if: ">1500"
                error_if: ">5000"
      - name: price
        data_tests:
          - not_null
      - name: date_of_transfer
        data_tests:
          - not_null
      - name: property_type_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["D", "S", "T", "F", "O"]
      - name: old_new_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Y", "N"]
      - name: duration_code
        description: F freehold, L leasehold, U unknown. Land Registry does not document U; 525 category A sales from 1995 to 2007 carry it.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["F", "L", "U"]
      - name: ppd_category_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["A", "B"]
      - name: record_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["A", "C", "D"]
  - name: stg_postcodes
    description: One row per postcode in the NSPL, live and terminated, with stable column names and ONS pseudo codes turned into nulls.
    columns:
      - name: postcode
        description: Single-space format, as Price Paid writes it.
        data_tests:
          - unique
          - not_null
      - name: postcode_district
        data_tests:
          - not_null
      - name: introduced_on
        data_tests:
          - not_null
      - name: country_code
        data_tests:
          - accepted_values:
              arguments:
                values: ["E92000001", "W92000004", "S92000003", "N92000002", "L93000001", "M83000003"]
      - name: region_code
        description: English regions only. Null for Wales, which ONS gives a pseudo code.
        data_tests:
          - accepted_values:
              arguments:
                values: ["E12000001", "E12000002", "E12000003", "E12000004", "E12000005", "E12000006", "E12000007", "E12000008", "E12000009"]
